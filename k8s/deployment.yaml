apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumify-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resumify-frontend
  template:
    metadata:
      labels:
        app: resumify-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: resumify-frontend
        image: rajajeba/resumify-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: resumify-frontend-secrets
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: resumify-frontend
  namespace: default
spec:
  selector:
    app: resumify-frontend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
